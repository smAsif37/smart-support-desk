name: Deploy to Hugging Face Space
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}          # Settings > Secrets and variables > Actions > Secrets
          HF_USERNAME: ${{ vars.HF_USERNAME }}       # ... > Variables
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          git push --force "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE}" HEAD:main
